
// 终端编译源码生成aar命令:
// ./gradlew :react-native:packages:react-native:ReactAndroid:assembleDebug :react-native:packages:react-native:ReactAndroid:assembleRelease :react-native:packages:react-native:ReactAndroid:publishToMavenLocal --no-daemon

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
